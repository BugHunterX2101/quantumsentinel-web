name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build native C++ extension (optional — NumPy fallback exists)
        continue-on-error: true
        run: python -m pip install ./cpp --no-build-isolation
      - name: Compile Python sources
        run: python -m compileall -q backend tests
      # The suite runs against real PostgreSQL, the only supported database.
      # Linux/macOS use 16 (the production image's major version); Windows
      # runners ship one preinstalled version, which the action starts.
      # Pinned to the commit of the action's v1 branch.
      - name: Start PostgreSQL 16
        if: runner.os != 'Windows'
        uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca  # v1
        with:
          postgres-version: 16
          database: quantumsentinel_test
      - name: Start PostgreSQL (runner's preinstalled version)
        if: runner.os == 'Windows'
        uses: ankane/setup-postgres@b1a598d92f86cb2ed364411898d150d4eac6d5ca  # v1
        with:
          database: quantumsentinel_test
      - name: Run test suite
        shell: bash
        run: |
          # The action's superuser is the OS user on Linux/macOS, "postgres" on Windows.
          PGUSER=$([ "$RUNNER_OS" = "Windows" ] && echo postgres || whoami)
          export TEST_DATABASE_URL="postgresql+psycopg://${PGUSER}@localhost:5432/quantumsentinel_test"
          python -c "import psycopg, os; c = psycopg.connect(os.environ['TEST_DATABASE_URL'].replace('+psycopg', '')); print(c.execute('select version()').fetchone()[0]); c.close()"
          python -m pytest -q
      - name: Verify compiled extension imports (optional)
        continue-on-error: true
        run: python -c "import _qs_fast; print(_qs_fast.__file__)"

  # Deploys docker-compose.production.yml with Docker, then moves it off the
  # bootstrap superuser onto the least-privilege database roles.
  deploy-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cut a production deployment over to the least-privilege roles
        run: bash .github/scripts/compose_cutover.sh
      - name: Container logs
        if: failure()
        run: >-
          docker compose -p qsci -f docker-compose.production.yml --env-file .env.production
          --profile provision --profile backup logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: >-
          docker compose -p qsci -f docker-compose.production.yml --env-file .env.production
          --profile provision --profile backup down -v --remove-orphans || true


  # --------------------------------------------------------------------------
  # Security scanning stages
  # --------------------------------------------------------------------------
  security-bandit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Bandit
        run: pip install bandit[toml]
      - name: Run Bandit (Python SAST) — full report
        run: bandit -r backend -f json -o bandit-report.json --severity-level medium || true
      - name: Fail on high-severity, high-confidence findings
        run: bandit -r backend -q --severity-level high --confidence-level high
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  security-pip-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (dependency CVE scan, blocking)
        run: pip-audit --format json --output pip-audit-report.json
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  security-gitleaks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-semgrep:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (SAST)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten

  security-trivy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t quantumsentinel:ci .
      - name: Run Trivy (container scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: quantumsentinel:ci
          format: table
          severity: CRITICAL,HIGH
          # Block on HIGH/CRITICAL that have a fix; unfixed base-image CVEs
          # are reported by upstream but cannot be remediated here.
          ignore-unfixed: true
          exit-code: 1
