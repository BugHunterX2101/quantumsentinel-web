# Database credentials (backend/db_roles.py). The API connects as qs_app,
# research jobs run in the `research-worker` service as qs_research_worker,
# migrations run as qs_migrator in the one-off `migrate` service, backups run
# as qs_backup, and only `postgres` and `provision` see the bootstrap
# superuser's password. Every service that loads PRODUCTION_ENV_FILE blanks
# the database passwords (x-no-db-passwords), so none leaks through that file.
# Before the first `up` with these roles (and to change a role's password):
#   docker compose -f docker-compose.production.yml --env-file .env.production --profile provision run --rm provision
#
# Networks: postgres and redis sit only on `data`, which has no route out, so
# the database cannot reach the internet and nginx cannot reach the database.
# The API and the research worker also join `edge` for market data.
x-app: &app
  build: .
  image: quantumsentinel-web:production
  env_file: ${PRODUCTION_ENV_FILE:-.env.production}
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs:
    - /tmp:mode=1777,size=64m
    - /var/run:mode=1777,size=8m

x-no-db-passwords: &no-db-passwords
  POSTGRES_PASSWORD: ""
  DB_APP_PASSWORD: ""
  DB_RESEARCH_WORKER_PASSWORD: ""
  DB_MIGRATOR_PASSWORD: ""
  DB_BACKUP_PASSWORD: ""

# The API's own secrets, which a research worker never uses. Each is blanked
# along with its *_FILE form, which backend/config.py reads in its place.
x-no-api-secrets: &no-api-secrets
  JWT_PRIVATE_KEY: ""
  JWT_PRIVATE_KEY_FILE: ""
  JWT_PUBLIC_KEY: ""
  JWT_PUBLIC_KEY_FILE: ""
  WEBHOOK_ENCRYPTION_KEY: ""
  WEBHOOK_ENCRYPTION_KEY_FILE: ""
  PRIVATE_KEY_ENCRYPTION_KEY: ""
  PRIVATE_KEY_ENCRYPTION_KEY_FILE: ""
  REFRESH_TOKEN_SECRET: ""
  REFRESH_TOKEN_SECRET_FILE: ""
  CSRF_SECRET: ""
  CSRF_SECRET_FILE: ""
  REDIS_PASSWORD: ""
  REDIS_URL: ""
  REDIS_URL_FILE: ""

services:
  # postgres and redis run as their images' own unprivileged users. Started as
  # root, their entrypoints chown the data directory and then switch user,
  # which needs CHOWN, SETUID and SETGID; with every capability dropped that
  # fails ("failed switching to 'postgres': operation not permitted"). The
  # images' data directories, and so new named volumes, already belong to
  # these users.
  postgres:
    image: postgres:16-alpine
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantumsentinel
      POSTGRES_USER: quantumsentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantumsentinel -d quantumsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  redis:
    image: redis:7-alpine
    user: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  # As the bootstrap superuser: creates the roles and hands them the schema,
  # migrating it first. Idempotent and safe while the application runs.
  provision:
    <<: *app
    profiles: ["provision"]
    restart: "no"
    command: ["python", "-m", "backend.manage", "provision-roles"]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://quantumsentinel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/quantumsentinel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      DB_RESEARCH_WORKER_PASSWORD: ${DB_RESEARCH_WORKER_PASSWORD:?Set DB_RESEARCH_WORKER_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?Set DB_BACKUP_PASSWORD}
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  # Applies pending schema migrations as qs_migrator and exits; the API and
  # the research worker start only once it has succeeded.
  migrate:
    <<: *app
    restart: "no"
    command: ["python", "-m", "backend.manage", "migrate"]
    environment:
      <<: *no-db-passwords
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://qs_migrator:${DB_MIGRATOR_PASSWORD:?Set DB_MIGRATOR_PASSWORD}@postgres:5432/quantumsentinel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy

  quantumsentinel:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *no-db-passwords
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://qs_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}@postgres:5432/quantumsentinel
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Research jobs run in the research-worker service, not in this one.
      RESEARCH_WORKER_MODE: external
      # Safe as "*" only because this service uses `expose` (below), not `ports`:
      # it is unreachable from outside the compose network, so every peer that
      # can connect to it at all is a container on this stack, and nginx is the
      # sole proxy_pass target that forwards real client IPs. If this service is
      # ever given a published port or a different network topology, replace "*"
      # with the reverse proxy's actual container IP/CIDR.
      FORWARDED_ALLOW_IPS: "*"
    expose: ["8000"]
    networks: [data, edge]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    cpus: "1.5"

  # Runs queued research jobs as qs_research_worker, which reaches the job
  # queue, research results and the audit trail, and no user, account, order,
  # position, key or token table. Scale with --scale research-worker=N.
  # It holds only the secrets it uses (QS_PROCESS_ROLE, backend/config.py):
  # its database URL and the server signing key. Its job processes hold none.
  research-worker:
    <<: *app
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    environment:
      <<: [*no-db-passwords, *no-api-secrets]
      ENVIRONMENT: production
      QS_PROCESS_ROLE: research-worker
      DATABASE_URL: postgresql+psycopg://qs_research_worker:${DB_RESEARCH_WORKER_PASSWORD:?Set DB_RESEARCH_WORKER_PASSWORD}@postgres:5432/quantumsentinel
    networks: [data, edge]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # One worker and its job process peaked at about 260 MB on the largest
    # research inputs; the limits keep research from starving the API.
    mem_limit: 1g
    cpus: "1.0"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    networks: [edge]
    depends_on:
      quantumsentinel:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The master binds 80/443 as root, creates its temp directories for the
    # nginx user (CHOWN) and starts its workers as that user (SETUID/SETGID).
    cap_add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_BACKUP_PASSWORD:?Set DB_BACKUP_PASSWORD}
    volumes:
      - postgres_backups:/backups
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # The dump names qs_owner as the owner of everything: create the roles
    # before restoring it, or restore with --no-owner.
    command: ["while true; do pg_dump -h postgres -U qs_backup -d quantumsentinel -Fc > /backups/quantumsentinel-$$(date +%Y%m%d%H%M%S).dump && find /backups -type f -mtime +7 -delete; sleep 21600; done"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

networks:
  data:
    internal: true
  edge: {}

volumes:
  postgres_data:
  redis_data:
  postgres_backups:
