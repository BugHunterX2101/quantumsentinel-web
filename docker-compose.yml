version: "3.9"
services:
  quantumsentinel:
    build: .
    ports: ["8000:8000"]
    environment:
      # JWT uses RS256 — provide base64-encoded PEM via secret or env.
      # Generate once with: python -c "from cryptography.hazmat.primitives.asymmetric import rsa; from cryptography.hazmat.primitives import serialization; k=rsa.generate_private_key(65537,2048); print(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.TraditionalOpenSSL,serialization.NoEncryption()).decode())"
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - DATABASE_URL=sqlite:////data/quantumsentinel.db
      - WEBHOOK_ENCRYPTION_KEY=${WEBHOOK_ENCRYPTION_KEY:-}
      - PRIVATE_KEY_ENCRYPTION_KEY=${PRIVATE_KEY_ENCRYPTION_KEY:-}
      # Persist server DSA identity so audit logs remain verifiable across restarts.
      # Generate once with the /api/security/rotate-keys endpoint and copy SERVER_DSA_* from the response.
      - SERVER_DSA_PRIVATE_KEY=${SERVER_DSA_PRIVATE_KEY:-}
      - SERVER_DSA_PUBLIC_KEY=${SERVER_DSA_PUBLIC_KEY:-}
      - SERVER_DSA_CREATED_AT=${SERVER_DSA_CREATED_AT:-}
      # Optional: Alpaca paper trading
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - qs_data:/data
    healthcheck:
      # Use /health/ready which checks DB + Redis connectivity, not just metadata
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  qs_data:
