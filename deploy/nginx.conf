events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Re-resolve the API's name (Docker's DNS) instead of keeping the address it
  # had when nginx started: a recreated API container usually gets a new one,
  # and nginx would otherwise send every request to the old address.
  # `resolve` needs nginx 1.27.3 or newer.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream quantumsentinel_app {
    zone quantumsentinel_app 64k;
    server quantumsentinel:8000 resolve;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 1m;
    proxy_read_timeout 90s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx is the edge: X-Forwarded-For is the address the connection came
    # from, and a header the client sent is discarded, not appended to. The
    # API trusts this header from any peer (FORWARDED_ALLOW_IPS "*") and
    # uvicorn takes its leftmost entry, so with $proxy_add_x_forwarded_for a
    # client would choose the address its rate limit, login lockout and audit
    # records are keyed on. Behind a load balancer or CDN, have nginx take the
    # client address from it (set_real_ip_from, real_ip_header) so that
    # $remote_addr stays the client.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location / { proxy_pass http://quantumsentinel_app; }
  }
}
