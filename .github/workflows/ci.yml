name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies and build the native extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ./cpp
      - name: Compile Python sources
        run: python -m compileall -q backend tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Verify compiled extension imports
        run: python -c "import _qs_fast; print(_qs_fast.__file__)"
